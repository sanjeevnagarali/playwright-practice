# Keep the image tag in sync with @playwright/test in package.json
image: mcr.microsoft.com/playwright:v1.63.0-noble

definitions:
  caches:
    npm: ~/.npm
  steps:
    - step: &install-verify
        name: Lint, types, framework rules
        caches: [npm]
        script:
          - npm ci
          - npm run verify
    - step: &smoke-pr
        name: Smoke (QA, 3rd parties mocked)
        caches: [npm]
        script:
          - npm ci
          - export CI=true TEST_ENV=qa MOCK_THIRD_PARTY=true
          - npx playwright test --grep @smoke --project=setup --project=storefront-chromium --project=api
        after-script:
          - bash scripts/ci-ai-triage.sh
        artifacts:
          - playwright-report/**
          - test-results/**
    - step: &shard
        name: Regression shard
        caches: [npm]
        script:
          - npm ci
          - export CI=true TEST_ENV=${TEST_ENV:-qa}
          - npx playwright test --grep @regression --shard=${BITBUCKET_PARALLEL_STEP}/${BITBUCKET_PARALLEL_STEP_COUNT} --reporter=blob,./src/reporters/AiTriageReporter.ts
        after-script:
          - bash scripts/ci-ai-triage.sh
        artifacts:
          - blob-report/**
          - test-results/**

pipelines:
  pull-requests:
    '**':
      - step: *install-verify
      - step: *smoke-pr

  branches:
    develop:
      - parallel:
          steps:
            - step: { <<: *shard, name: Regression 1/4 }
            - step: { <<: *shard, name: Regression 2/4 }
            - step: { <<: *shard, name: Regression 3/4 }
            - step: { <<: *shard, name: Regression 4/4 }
      - step:
          name: Merge HTML report
          caches: [npm]
          script:
            - npm ci
            - npx playwright merge-reports --reporter=html ./blob-report
          artifacts:
            - playwright-report/**
    main:
      - step:
          name: Smoke on staging
          caches: [npm]
          script:
            - npm ci
            - export CI=true TEST_ENV=staging
            - npx playwright test --grep @smoke --project=setup --project=storefront-chromium --project=api
          after-script:
            - bash scripts/ci-ai-triage.sh
          artifacts:
            - playwright-report/**
            - test-results/**

  custom:
    run-tests:
      - variables:
          - name: TEST_ENV
            default: qa
          - name: TAGS
            default: '@smoke'
          - name: PROJECT
            default: storefront-chromium
          - name: MOCK_THIRD_PARTY
            default: 'true'
          - name: TICKET
            default: ''
      - step:
          name: Run selected tests
          caches: [npm]
          script:
            - npm ci
            - export CI=true
            - if [ -n "$TICKET" ]; then TAGS="@$TICKET"; fi
            - npx playwright test --grep "$TAGS" --project=setup --project="$PROJECT"
          after-script:
            - bash scripts/ci-ai-triage.sh
          artifacts:
            - playwright-report/**
            - test-results/**
    nightly-regression:
      - step:
          name: Nightly regression (qa)
          script:
            - npm ci
            - CI=true TEST_ENV=qa npx playwright test --grep @regression
          after-script:
            - bash scripts/ci-ai-triage.sh
          artifacts:
            - playwright-report/**
            - test-results/**
    cross-browser:
      - step:
          name: Cross-browser smoke
          script:
            - npm ci
            - CI=true TEST_ENV=qa npx playwright test --grep "@cross-browser" --project=setup --project=storefront-firefox --project=storefront-webkit
          artifacts:
            - playwright-report/**
            - test-results/**
    prod-smoke:
      - step:
          name: Production read-only smoke
          script:
            - npm ci
            - CI=true TEST_ENV=prod npx playwright test --grep @prod-safe --project=storefront-chromium
          artifacts:
            - playwright-report/**
            - test-results/**
